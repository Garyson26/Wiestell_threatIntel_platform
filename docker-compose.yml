# `version:` is intentionally absent — obsolete in the Compose
# specification, and Compose v2+ emits a warning when it is present.
services:
  frontend:
    build: ./frontend
    ports:
      # Host ports are configurable so the harness can coexist with other local
      # stacks; container-side ports are fixed.
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Required — set in .env (never commit real credentials)
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=redis://redis:6379/0
      - OTX_API_KEY=${OTX_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - THREATFOX_API_KEY=${THREATFOX_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required (min 32 random chars)}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - FEED_SYNC_INTERVAL=${FEED_SYNC_INTERVAL:-3600}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-Wiestell <noreply@wiestell.com>}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - CRON_SECRET=${CRON_SECRET:-}
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-false}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    # Render free instance: 512 MB RAM, 0.1 CPU. Without a ceiling, local timings
    # and memory headroom bear no relation to production and Phase 5's
    # measurements are meaningless.
    #
    # Both syntaxes are present on purpose. `deploy.resources.limits` is the
    # Compose-spec form but was historically Swarm-only and ignored by
    # `docker compose up`; `mem_limit`/`cpus` are the legacy top-level form that
    # plain Compose has always honoured. Verified with `docker stats` on Compose
    # v5.1.2 / Docker 29.4 (cgroups v2) — see CLAUDE.md.
    mem_limit: 512m
    cpus: 0.1
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.1'

  celery-worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker -l info -c 4
    environment:
      # Required — set in .env (never commit real credentials)
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=redis://redis:6379/0
      - OTX_API_KEY=${OTX_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - THREATFOX_API_KEY=${THREATFOX_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required (min 32 random chars)}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-Wiestell <noreply@wiestell.com>}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build: ./backend
    command: celery -A app.tasks.celery_app beat -l info
    environment:
      # Required — set in .env (never commit real credentials)
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required (min 32 random chars)}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Local database for the `-m mysql` test tier ──────────────────────────
  #
  # The PostgreSQL service that used to sit here (commented out) has been deleted.
  # Keeping it was an active hazard: this codebase targets MySQL — json_contains,
  # naive-UTC DATETIME, INSERT ... IGNORE, CHAR(36) ids — and a Postgres container
  # invites testing against the wrong dialect. That already cost the project two
  # crash-on-call endpoints, where `/attack/*` and the correlation engine used the
  # PostgreSQL-only ARRAY comparators `.any()` and `.overlap()` against MySQL JSON
  # columns and raised on every request.
  #
  # IMAGE MUST MATCH PRODUCTION. Hostinger may be MySQL 8 or MariaDB, and their
  # JSON function semantics differ — MariaDB implements JSON as LONGTEXT with a
  # CHECK constraint and its json_contains argument handling is not identical.
  # Testing MySQL 8 semantics against a MariaDB host produces false confidence,
  # which is worse than not testing at all. Confirm with `SELECT VERSION();` on
  # production, then pin DB_IMAGE in .env to the matching tag, e.g.
  #     DB_IMAGE=mariadb:11.4
  db:
    image: ${DB_IMAGE:-mysql:8.0}
    command: >
      --wait-timeout=30
      --interactive-timeout=30
      --max-connections=50
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-sentinel}
      - MYSQL_DATABASE=${DB_NAME:-sentinel_test}
      - MYSQL_USER=${DB_USER:-sentinel}
      - MYSQL_PASSWORD=${DB_PASSWORD:-sentinel}
      # MariaDB reads the MARIADB_* names; setting both keeps one service
      # definition working for either image.
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-sentinel}
      - MARIADB_DATABASE=${DB_NAME:-sentinel_test}
      - MARIADB_USER=${DB_USER:-sentinel}
      - MARIADB_PASSWORD=${DB_PASSWORD:-sentinel}
    # wait_timeout=30 is deliberate and is the point of this container.
    #
    # Production runs on a shared host that closes idle connections. The
    # aiomysql.Connection.ensure_closed patch in app/database.py and the
    # pool_recycle=280 / pool_pre_ping settings beside it exist to survive exactly
    # that. At MySQL's default 28800s (8 hours) the failure never fires in a local
    # session, so the patch is effectively untested — 30 seconds makes it fire
    # within a minute of idling. Do not raise this to make a flaky test pass; the
    # flakiness is the signal.
    ports:
      # Loopback only, same reasoning as redis below.
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # mysqladmin ping ships in both the mysql and mariadb images.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent || mysqladmin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Bound to loopback only: an unauthenticated Redis reachable from the LAN
    # is a full read/write of the cache and Celery queue.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
