# Runs the default test tier in a clean environment installed from the pins.
#
# Until this existed, every green run was a developer's machine, which had drifted
# from 21 of 28 pins. The pinned set had never been tested together, and the first
# deploy of it failed: SQLAlchemy 2.1 stopped installing greenlet (#136). Install
# from requirements-dev.txt and nothing else. A package added by hand here would
# hide exactly the class of failure this job exists to catch.
#
# The MySQL tier (`pytest -m mysql`) needs a MariaDB service container and is not
# run here yet.

name: tests

on:
  pull_request:
  push:
    branches: [Master]

permissions:
  contents: read

jobs:
  default-tier:
    runs-on: ubuntu-latest
    # A container rather than setup-python: setup-python has no 3.11.9 build for the
    # current ubuntu-latest, and the image does not move when the runner does.
    # Must match PYTHON_VERSION in render.yaml; tests/test_dependency_pins.py checks.
    container: python:3.11.9-slim
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install from the pins
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Default tier
        run: python -m pytest
