name: Feed sync (external cron)

# Drives the ONE live background path: POST /api/v1/feeds/sync-all.
#
# Three background mechanisms exist in this codebase and only this one runs — the asyncio
# scheduler loop is implemented but never started, and the Celery beat schedule is
# entirely commented out. See CLAUDE.md. So this workflow is not a convenience: it is
# what makes ingestion happen at all.
#
# THE SCHEDULE HERE AND MalwareBazaarFeed._GOVERNING_SYNC_INTERVAL_SECONDS MUST AGREE.
# That constant (6h = four firings a day) is what the rolling-window continuity check
# uses to decide whether records could have fallen through a gap between syncs. If this
# cron fires less often than the constant claims, the window check silently under-reports
# gaps and indicators are lost without a warning. The relationship is asserted by
# tests/test_deploy_config.py, which parses the cron expression out of this file — so the
# loop is closed in CI rather than by anyone remembering.
#
# STATUS: placeholder values, deliberately. The interval below matches the constant, but
# the exact minute offsets are unchosen — they should be staggered away from the top of
# the hour once the feed sources' own publish times are known, so a sync does not race a
# feed's own regeneration. Changing the interval means changing the constant in the same
# commit; the test enforces that.

on:
  schedule:
    # Every 6 hours = 4 firings/day, matching _GOVERNING_SYNC_INTERVAL_SECONDS.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual run (recorded in the job log)"
        required: false
        default: "manual trigger"

concurrency:
  # A sync holds row locks in MySQL and the feed ingestion path is tuned around lock
  # contention on a shared host. Two overlapping runs would contend with each other, so a
  # slow run must delay the next rather than double up. cancel-in-progress is deliberately
  # FALSE: killing a sync mid-chunk leaves the watermark behind the data it already wrote.
  group: feed-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Generous, because a cold Render instance has to wake before it answers, and a full
    # sync across 11 feeds is minutes rather than seconds. Not unbounded: a hung sync
    # should fail visibly rather than burn the runner budget.
    timeout-minutes: 25
    steps:
      - name: Trigger feed sync
        env:
          API_BASE: ${{ vars.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${API_BASE:-}" ]; then
            echo "::error::API_BASE_URL repository variable is not set"
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET repository secret is not set"
            exit 1
          fi

          # X-Cron-Secret is accepted by require_admin_or_cron as an alternative to an
          # admin token, compared with hmac.compare_digest and only when the server has a
          # non-empty secret configured. It must match Render's CRON_SECRET exactly.
          #
          # --fail-with-body so a non-2xx exits non-zero AND prints the body: the response
          # carries per-feed status, and a silent failure here means ingestion stops with
          # nobody noticing. Response is redacted server-side, so it is safe to log.
          # Body written to a file rather than a variable so a large response is not
          # truncated by shell handling.
          http_status=$(
            curl --silent --show-error --fail-with-body \
                 --connect-timeout 30 --max-time 1200 \
                 --retry 3 --retry-delay 30 --retry-connrefused \
                 --output response.json --write-out '%{http_code}' \
                 -X POST "${API_BASE%/}/api/v1/feeds/sync-all" \
                 -H "X-Cron-Secret: ${CRON_SECRET}" \
                 -H "Content-Type: application/json"
          )
          echo "HTTP ${http_status}"
          echo '--- response ---'
          cat response.json || true
          echo

      - name: Classify the outcome
        run: |
          set -euo pipefail

          # WHY THIS STEP EXISTS. A non-2xx from our own endpoint is a real failure and
          # the curl above already fails on it. But a 200 carrying `status: failed` for
          # ONE feed is the NORMAL path — third-party feeds rate-limit, move URLs and go
          # down, which is exactly what feed_sources.consecutive_failures and its backoff
          # exist to absorb. Turning that red gives a red badge most days, and a badge
          # that is usually red is a badge nobody reads.
          #
          # So: fail on a non-2xx (curl), a timeout (curl), or a response we cannot parse
          # (here). Do NOT fail on a partial feed failure. DO fail when EVERY feed in the
          # run failed, because that is systemic — an expired cron secret, a dead
          # database, a bad deploy — rather than flaky.
          python3 - <<'PY'
          import json, os, sys

          try:
              with open("response.json", encoding="utf-8") as fh:
                  payload = json.load(fh)
          except (OSError, ValueError) as exc:
              print(f"::error::sync-all returned a body that is not valid JSON: {exc}")
              sys.exit(1)

          # Tolerate either a top-level list of feed results or a dict wrapping one, since
          # the response shape is not pinned by a schema. Unknown shape is reported, not
          # guessed at, and is NOT treated as a failure on its own — the endpoint answered.
          results = None
          if isinstance(payload, list):
              results = payload
          elif isinstance(payload, dict):
              for key in ("feeds", "results", "synced"):
                  if isinstance(payload.get(key), list):
                      results = payload[key]
                      break

          if results is None:
              print("::notice::sync-all responded 2xx but its shape was not recognised; "
                    "not treating that as a failure. Update this step if the contract changed.")
              sys.exit(0)

          def failed(entry):
              if not isinstance(entry, dict):
                  return False
              status = str(entry.get("status", "")).lower()
              return status in {"failed", "error"}

          total = len(results)
          bad = [e for e in results if failed(e)]

          def name(entry):
              return entry.get("slug") or entry.get("name") or entry.get("feed") or "?"

          for entry in bad:
              print(f"::warning::feed reported failure: {name(entry)} — "
                    f"{str(entry.get('error') or entry.get('message') or '')[:200]}")

          print(f"{total - len(bad)}/{total} feeds healthy")

          if total and len(bad) == total:
              print("::error::EVERY feed in this run reported failure. That is systemic "
                    "rather than flaky — check the cron secret, the database and the last "
                    "deploy before assuming the sources are all down simultaneously.")
              sys.exit(1)
          PY

      - name: Summarise into the run page
        if: always()
        run: |
          {
            echo "### Feed sync"
            echo
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo
            echo '```json'
            head -c 4000 response.json 2>/dev/null || echo '(no response captured)'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────────────
  # IS PRODUCTION RUNNING WHAT IS ON MASTER?  (#139)
  #
  # A failed Render deploy is silent. Render keeps the previous build serving, so the
  # health checks stay green, the dashboard works, this workflow's sync succeeds and
  # /cron-status reports no degradation. That is how production ran the 2026-11-01 build
  # for eight days while two deploys failed (#136). This job turns that state into a red
  # run.
  #
  # Separate job, not a step of `sync`: it must neither delay nor be skipped by a sync
  # failure, and a drift failure must not be mistaken for a feed failure.
  #
  # It asks Render which commit is live instead of asking the application, so it needs no
  # app change and no RENDER_GIT_COMMIT (#139 step 1, unconfirmed).
  #
  # WHAT "CURRENT" MEANS. Render builds this service only when a push changes files under
  # backend/ (rootDir), and then deploys the push's HEAD -- which may itself touch nothing
  # in backend/ (e9f0f97 was deployed that way). So "live == Master" and "live == newest
  # backend commit" both raise false alarms. The check is whether the live commit's
  # backend/ tree is identical to Master's. If not, the oldest backend change missing from
  # production must be older than GRACE_SECONDS before the run fails, which leaves time
  # for a build that is merely in progress.
  #
  # NEEDS: secret RENDER_API_KEY and variable RENDER_SERVICE_ID. Render API keys are not
  # scoped -- this one can do anything the account can -- although this job only reads.
  # Missing configuration fails the job loudly instead of skipping it: a drift check that
  # silently does not run is the failure mode it exists to remove.
  deploy-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Master with history
        uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Read the live deploy from Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "::error::RENDER_API_KEY (secret) and RENDER_SERVICE_ID (variable) must both be set for the deploy-drift check"
            exit 1
          fi
          curl --silent --show-error --fail-with-body --max-time 60 \
               --retry 3 --retry-delay 10 \
               -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" \
               --output deploys.json \
               "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=20"

      - name: Compare the live commit against Master
        run: |
          python3 - <<'DRIFT'
          import json, subprocess, sys, time

          # Long enough for a build that is still running, short enough that a failed
          # deploy turns the next 6-hourly run red. A Render build here takes ~1-2 min.
          GRACE_SECONDS = 3600

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True)

          try:
              with open("deploys.json", encoding="utf-8") as fh:
                  payload = json.load(fh)
          except (OSError, ValueError) as exc:
              print(f"::error::could not read Render's deploy list: {exc}")
              sys.exit(1)

          # The API wraps each entry as {"deploy": {...}, "cursor": ...}; accept the bare
          # form too rather than guessing which one a future response uses.
          deploys = []
          for item in payload if isinstance(payload, list) else []:
              if isinstance(item, dict):
                  inner = item.get("deploy", item)
                  if isinstance(inner, dict):
                      deploys.append(inner)

          def commit_of(deploy):
              return (deploy.get("commit") or {}).get("id") or ""

          live = next((commit_of(d) for d in deploys if d.get("status") == "live"), "")
          latest = deploys[0] if deploys else {}
          latest_note = (f"most recent deploy: {commit_of(latest)[:12] or '?'} "
                         f"status={latest.get('status', '?')}")

          if not live:
              print(f"::error::Render reports no live deploy among the {len(deploys)} most "
                    f"recent ({latest_note}). Either nothing is serving or the history is "
                    "longer than one page; both need a person.")
              sys.exit(1)

          if git("cat-file", "-e", f"{live}^{{commit}}").returncode != 0:
              print(f"::error::the live commit {live[:12]} is not in this repository's "
                    f"history; production is serving something Master never contained "
                    f"({latest_note}).")
              sys.exit(1)

          if git("diff", "--quiet", live, "HEAD", "--", "backend").returncode == 0:
              print(f"production is current: live {live[:12]} has every backend/ change "
                    "on Master")
              sys.exit(0)

          pending = [(line.split(" ", 2) + ["", ""])[:3] for line in git(
              "log", "--reverse", "--format=%H %ct %s", f"{live}..HEAD", "--", "backend"
          ).stdout.splitlines() if line.strip()]

          if not pending:
              print(f"::error::live {live[:12]} differs from Master under backend/ but "
                    "is not behind it -- it carries changes Master does not "
                    f"({latest_note}).")
              sys.exit(1)

          oldest_sha, oldest_ts, oldest_subject = pending[0]
          age = time.time() - int(oldest_ts)
          summary = (f"{len(pending)} backend commit(s) on Master are not live; the oldest, "
                     f"{oldest_sha[:12]} \"{oldest_subject}\", is {age / 3600:.1f} h old. "
                     f"Live: {live[:12]}; {latest_note}.")
          if age < GRACE_SECONDS:
              print(f"::notice::within the {GRACE_SECONDS // 60}-minute grace period: "
                    + summary)
              sys.exit(0)
          print("::error::production is behind Master. " + summary)
          sys.exit(1)
          DRIFT
