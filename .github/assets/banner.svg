<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Wiestell</title>
  <desc id="desc">Wiestell — open-source threat intelligence platform</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#151a2e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#b794f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b794f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="16" fill="url(#glow)"/>

  <!-- W mark, after the brand logo -->
  <g transform="translate(96 92)" stroke-linecap="round" stroke-width="34" fill="none">
    <line x1="18"  y1="18" x2="76"  y2="136" stroke="#b794f6" stroke-opacity="0.95"/>
    <line x1="76"  y1="136" x2="134" y2="18" stroke="#ff75bc" stroke-opacity="0.85"/>
    <line x1="134" y1="18" x2="192" y2="136" stroke="#4dc9e6" stroke-opacity="0.85"/>
    <line x1="192" y1="136" x2="250" y2="18" stroke="#ff75bc" stroke-opacity="0.95"/>
  </g>

  <text x="400" y="160" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="84" font-weight="700" fill="#f5f7fb" letter-spacing="2">Wiestell</text>
  <text x="404" y="206" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#aab3c8">Open-source threat intelligence platform</text>

  <g font-family="Consolas, Menlo, monospace" font-size="16" fill="#cfd6e6">
    <rect x="404" y="232" width="148" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#b794f6" stroke-opacity="0.5"/>
    <text x="478" y="253" text-anchor="middle">IOC ingestion</text>
    <rect x="564" y="232" width="124" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ff75bc" stroke-opacity="0.5"/>
    <text x="626" y="253" text-anchor="middle">enrichment</text>
    <rect x="700" y="232" width="148" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#4dc9e6" stroke-opacity="0.5"/>
    <text x="774" y="253" text-anchor="middle">threat scoring</text>
    <rect x="860" y="232" width="148" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#6c68c3" stroke-opacity="0.7"/>
    <text x="934" y="253" text-anchor="middle">MITRE ATT&amp;CK</text>
  </g>
</svg>
