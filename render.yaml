# Render.com Blueprint - Backend API Only
# Frontend is deployed separately on Vercel
# Deploy with one click: https://render.com/docs/blueprint-spec

services:
  # ============================================================================
  # BACKEND API - FastAPI
  # ============================================================================
  - type: web
    name: wiestell-backend
    runtime: python
    plan: starter  # Change to 'standard' or 'pro' for production
    region: oregon  # Change to your preferred region (oregon, frankfurt, singapore, etc.)
    buildCommand: |
      python --version
      pip install --upgrade pip
      pip install -r requirements.txt
      python download_geolite2.py || echo "⚠️  GeoLite2 download failed - continuing..."
      alembic upgrade head || echo "⚠️  Database migration failed - continuing..."
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --log-level info
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: FEED_SYNC_INTERVAL
        value: 3600
      - key: GEOIP_DB_PATH
        value: /opt/render/project/src/backend/data/GeoLite2-City.mmdb
      # Database - Use existing MySQL (Hostinger)
      - key: DATABASE_URL
        value: mysql+pymysql://u433859718_wiest_tell:C9b%3E%3BxrFy@193.203.184.197/u433859718_intel_wies_tel
      - key: DATABASE_ASYNC_URL
        value: mysql+aiomysql://u433859718_wiest_tell:C9b%3E%3BxrFy@193.203.184.197/u433859718_intel_wies_tel
      # Redis - Connected to Redis service below
      - key: REDIS_URL
        fromService:
          name: wiestell-redis
          type: redis
          property: connectionString
      # Security
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates secure random value
      # CORS - Frontend on Vercel
      - key: CORS_ORIGINS
        value: https://wiestell.com,https://www.wiestell.com,https://wiestell.vercel.app
      # Email Configuration - Hostinger SMTP
      - key: EMAIL_SERVICE
        value: smtp
      - key: EMAIL_USER
        sync: false  # Set manually in Render dashboard
      - key: EMAIL_PASSWORD
        sync: false  # Set manually in Render dashboard (secret)
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      # API Keys (Optional - set in Render dashboard)
      - key: OTX_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: VT_API_KEY
        sync: false
      - key: SHODAN_API_KEY
        sync: false
      - key: PHISHTANK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MALWAREBAZAAR_API_KEY
        sync: false
      - key: THREATFOX_API_KEY
        sync: false
      - key: URLHAUS_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true  # Auto-deploy on git push
    disk:
      name: geolite-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  # ============================================================================
  # FRONTEND - Next.js
  # ============================================================================
  - type: web
    name: sentinel-frontend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    rootDir: frontend
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: sentinel-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    autoDeploy: true

  # ============================================================================
  # REDIS - Caching & Background Jobs
  # ============================================================================
  - type: redis
    name: sentinel-redis
    plan: starter  # Free tier available
    region: oregon
    ipAllowList: []  # Allow all (within Render network)
    maxmemoryPolicy: allkeys-lru  # Evict least recently used keys when full

