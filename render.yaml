# Render.com Blueprint - Backend API Only
# Frontend is deployed separately on Vercel
# Deploy with one click: https://render.com/docs/blueprint-spec

services:
  # ============================================================================
  # BACKEND API - FastAPI
  # ============================================================================
  - type: web
    name: wiestell-backend
    # runtime: python -- a NATIVE build, so `buildCommand` below runs.
    #
    # THIS MATTERS BECAUSE backend/Dockerfile EXISTS. Render's dashboard creation form
    # auto-detects and will offer Docker; if the service is created that way rather than
    # from this blueprint, `buildCommand` NEVER RUNS. Consequences, both silent:
    #
    #   * download_geolite2.py never executes -> no GeoIP for the entire IP population
    #   * GEOIP_DB_PATH below points at /opt/render/project/src/backend/data/..., which
    #     does not exist in the image -- the Dockerfile's WORKDIR is /app and it creates
    #     /app/data
    #
    # Create this service FROM THE BLUEPRINT, or if you create it by hand choose the
    # Python runtime explicitly and paste the buildCommand.
    runtime: python
    # FREE, confirmed 2026-08-17. This is not a cost setting alone -- several
    # decisions elsewhere are sized for a free instance and must move together if it
    # ever changes: --workers 1 in startCommand (six single-process subsystems),
    # pool_size/max_overflow in database.py (a SHARED MySQL account allowance), and
    # ENRICHMENT_CONCURRENCY=5 (third-party rate limits are per key, not per task).
    # Free also means NO SHELL and no one-off jobs -- see DEPLOY_CHECKLIST s2/s3.
    plan: free
    region: frankfurt  # eu-central. IMMUTABLE after creation -- recreating the
                       # service is the only way to change it.
    buildCommand: |
      python --version
      pip install --upgrade pip
      pip install -r requirements.txt
      # GeoLite2 FAILS OPEN DELIBERATELY -- a missing geo database degrades enrichment
      # but must not block a deploy. The warning is banner-framed because the previous
      # single line was lost in pip output, and the consequence is not small: GeoIP
      # becomes unavailable for the ENTIRE IP population.
      #
      # It is also detectable at runtime, verified 2026-08-17 rather than assumed --
      # `build_registry()` gates geoip out when the file is absent and
      # `/cron-status` reports `geoip_database_missing` (admin-gated, so look for it).
      python download_geolite2.py || {
        echo "=============================================================="
        echo "!!  GeoLite2 DOWNLOAD FAILED -- DEPLOY CONTINUING WITHOUT IT  !!"
        echo "!!                                                            !!"
        echo "!!  GeoIP is now unavailable for the ENTIRE IP population.    !!"
        echo "!!  Check MAXMIND_ACCOUNT_ID / MAXMIND_LICENSE_KEY.           !!"
        echo "!!  Confirm with: GET /cron-status -> geoip_database_missing  !!"
        echo "=============================================================="
      }
      # `alembic upgrade head` REMOVED 2026-08-17, not silenced. Migrations run from a
      # developer machine (DEPLOY_CHECKLIST s2) because Render free instances have no
      # shell, so this line was redundant -- and it carried `|| echo "continuing"`,
      # which meant a failed migration produced a SUCCESSFUL deploy against an
      # unmigrated database. A redundant line that swallows failures is worse than an
      # absent one.
    # --workers 1 is DELIBERATE AND LOAD-BEARING, not a throughput oversight. uvicorn
    # already defaults to a single worker, so this is declared rather than relied upon:
    # five separate conclusions elsewhere assume one process per instance, and raising
    # this silently invalidates all of them. See tests/test_process_model.py.
    #
    #   1. the in-memory rate limiter becomes N independent limiters, so the effective
    #      budget is N x AUTH_RATE_LIMIT_MAX (SECURITY_REVIEW.md residual risk #5);
    #   2. the database pool is per process, so pool_size=2 + max_overflow=3 becomes
    #      5N connections against a SHARED Hostinger account allowance;
    #   3. enrichment_engine's module-level semaphore bounds concurrency per process, so
    #      the real ceiling becomes 5N third-party calls in flight;
    #   4. any in-process cache would be N caches serving inconsistent reads;
    #   5. REDIS_URL is deliberately unset (see below), which is only correct because the
    #      limiter's fallback is process-local — at N workers a shared store is REQUIRED.
    #
    # If throughput ever requires more workers, all five have to be revisited together —
    # provision Redis for (1), (4) and (5), a smaller pool_size for (2), and a shared bound
    # for (3).
    # --no-proxy-headers is DELIBERATE (finding R-05). uvicorn's proxy_headers defaults
    # to TRUE, and its ProxyHeadersMiddleware rewrites request.client.host from
    # X-Forwarded-For whenever the peer is in FORWARDED_ALLOW_IPS. That is a SECOND
    # algorithm on the same header as deps.py::_client_ip, and the two can disagree.
    #
    # This app's is the one to keep: it fails closed at TRUSTED_PROXY_HOPS=0, it is under
    # test, and it is configured in a file. uvicorn's is on by default, driven by an
    # environment variable a dashboard makes trivially settable, and degrades to taking the
    # LEFT-MOST (attacker-supplied) entry under FORWARDED_ALLOW_IPS=*.
    #
    # Note the flag: `--proxy-headers=false` is INVALID and uvicorn refuses to start
    # ("Option '--proxy-headers' does not take a value"). The disable form is
    # --no-proxy-headers. Pinned by tests/test_process_model.py.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --log-level info --workers 1 --no-proxy-headers
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: FEED_SYNC_INTERVAL
        value: 3600
      - key: GEOIP_DB_PATH
        value: /opt/render/project/src/backend/data/GeoLite2-City.mmdb
      # MaxMind credentials for the build-time GeoLite2 download. Free, but an account
      # is required. Without these the download step fails, the `|| echo` swallows it,
      # the .mmdb is absent, and GeoIP is gated off — so the ENTIRE IP population is
      # enriched with no country or ASN data, silently. Declared here (rather than only
      # in the dashboard) so the dependency is visible at the point the build step reads
      # it. See PROJECT_SUMMARY.md §8 item 14; owner decision still open on whether to
      # provision these or accept IP enrichment without geo permanently.
      - key: MAXMIND_ACCOUNT_ID
        sync: false
      - key: MAXMIND_LICENSE_KEY
        sync: false
      # Trusted reverse-proxy hop count for rate-limit bucketing. 0 = trust nothing and
      # use the socket peer, which is the safe default and what ships. Render terminates
      # TLS at its own edge, so this needs a non-zero value here — but set it from a
      # MEASURED count, not from documentation: log the raw X-Forwarded-For from a
      # deployed instance and count the entries.
      #
      # WHICH WAY IS DANGEROUS (corrected 2026-08-04, finding R-03 - this comment previously
      # said the opposite). Indices count from the RIGHT, and the right-hand entries are the
      # ones infrastructure appended:
      #   TOO HIGH -> indexes further LEFT, into the client-supplied portion -> ATTACKER-CHOSEN
      #   too low  -> indexes right, onto a trusted proxy's own address -> a shared bucket,
      #               over-restrictive but NOT spoofable
      # So err LOW if you must err. The earlier wording pointed operators at the exploitable
      # direction.
      #
      # AND COUNTING IS NOT SUFFICIENT. If the Render origin (*.onrender.com) is reachable
      # off-edge, a request straight to the origin bypasses any CDN while still satisfying a
      # hop count measured THROUGH that CDN - so the attacker's own entry lands at the index
      # being trusted. Establish whether the origin is directly reachable BEFORE setting this;
      # if it is, 0 may be the only honest value. See SECURITY_REVIEW.md residual risk #5.
      - key: TRUSTED_PROXY_HOPS
        sync: false
      # Database — set manually in the Render dashboard. Connection strings
      # contain credentials and must never be committed to the repository.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_ASYNC_URL
        sync: false
      # REDIS_URL is deliberately NOT set here (2026-08-04). utils/rate_limiter falls back
      # to process-local state when it is absent, and with ONE worker per instance that
      # fallback is correct — see the single-process note in CLAUDE.md, of which this is now
      # the fifth dependent. Residual risk #5's live cause is the X-Forwarded-For bypass,
      # which Redis does not touch, so provisioning it would buy nothing today.
      # The variable stays documented as optional in .env.example; only the service and the
      # wiring are removed. Raising the worker count is what makes Redis necessary again.
      # Security
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates secure random value
      # CORS - Frontend on Vercel (explicit origins only, never "*")
      - key: CORS_ORIGINS
        value: https://wiestell.com,https://www.wiestell.com,https://wiestell.vercel.app
      # Shared secret for scheduler-triggered maintenance endpoints
      - key: CRON_SECRET
        generateValue: true
      # Interactive API docs stay closed in production
      - key: ENABLE_API_DOCS
        value: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ENABLE_ERROR_EMAILS
        value: false
      # Email — Resend HTTP API over 443. SMTP was removed in Phase 3 because Render
      # free web services cannot reach 25/465/587, which made OTP login impossible.
      # Sending-access key only; never add this name to ALLOWED_FEED_API_KEY_ENVS.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Wiestell <noreply@wiestell.com>
      # API Keys (Optional - set in Render dashboard)
      - key: OTX_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: SHODAN_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MALWAREBAZAAR_API_KEY
        sync: false
      - key: THREATFOX_API_KEY
        sync: false
      - key: URLHAUS_API_KEY
        sync: false
    # PREVIEWS OFF, EXPLICITLY. Free instances draw from one 750-hour monthly pool
    # across the whole account, so every preview service spun up for a pull request
    # burns hours the production service needs. Off is Render's default, but the
    # default is not the reason -- this is a decision, so it is declared.
    previewsEnabled: false
    healthCheckPath: /health
    # healthCheckInterval / healthCheckTimeout REMOVED 2026-08-17. They were set to 50s
    # with the comment "keep service alive" -- which is the keep-alive the deploy design
    # explicitly rejects. A 50-second health check means the service NEVER sleeps and
    # burns ~744 of the 750 free instance-hours in a month, leaving nothing for anything
    # else on the account. The four-window sync cadence is designed around the instance
    # sleeping between windows. Render's defaults are correct here.
    autoDeploy: true  # Auto-deploy on git push

    # A `disk:` block was REMOVED here on 2026-08-17, for two independent reasons:
    #
    #   1. Persistent disks are not available on free instances. This is what the
    #      Blueprint was rejected for.
    #   2. IT WOULD HAVE SHADOWED THE THING IT WAS MEANT TO PRESERVE. The disk mounted at
    #      /opt/render/project/src/backend/data -- byte-identical to the directory
    #      GEOIP_DB_PATH points into, which is where `download_geolite2.py` writes AT
    #      BUILD TIME. The build writes the .mmdb into the image; the disk then mounts
    #      over that directory at runtime and hides it. GeoIP would have been missing
    #      despite a successful, correctly-credentialled download -- and the only signal
    #      is `geoip_database_missing` on the admin-gated /cron-status.
    #
    # No disk is needed: the database is baked into the image at build time and is
    # replaced on every deploy, which is the correct lifecycle for a file that ships
    # with the code rather than accumulating at runtime.

  # ============================================================================
  # FRONTEND - removed 2026-08-17
  # ============================================================================
  # A `sentinel-frontend` web service was declared here. Deleted because:
  #
  #   * THE FRONTEND DEPLOYS TO VERCEL, not Render. The block was vestigial.
  #   * Leaving it meant Render would create a SECOND free web service drawing from the
  #     same 750-hour monthly pool the backend needs -- the same reason previews are
  #     disabled above.
  #   * Its NEXT_PUBLIC_API_URL used `fromService` to read RENDER_EXTERNAL_URL from a
  #     service named `sentinel-backend`, but the backend block is `wiestell-backend`.
  #     The reference could never have resolved.
  #
  # Set NEXT_PUBLIC_API_URL in the VERCEL dashboard instead. And note the cutover trap
  # recorded in DEPLOY_CHECKLIST s4.0: frontend/vercel.json ALSO hard-codes the old
  # backend origin with no env override, and its edge rewrite takes precedence over
  # next.config.js -- so setting the env var alone does not repoint traffic.

