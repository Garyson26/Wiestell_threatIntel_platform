[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# `-m "not mysql"` keeps the default run database-free and ~5s. The mysql tier is
# opt-in:  python -m pytest -m mysql
addopts = -q --strict-markers -m "not mysql"
markers =
    mysql: requires the local MySQL/MariaDB container from docker-compose.yml. Skipped by default; run with `-m mysql` after `docker compose up -d db`. Covers what a DB-free suite structurally cannot — JSON column comparators, naive-UTC datetime semantics, the ingestion INSERT/UPDATE path, savepoint isolation and idle-connection recovery.
    slow: takes tens of seconds (idles past wait_timeout). Part of the mysql tier.
    query_budget: asserts a statement-count ceiling for an endpoint. Several are xfail(strict=True) pending the N+1 fixes — see tests/test_query_budget.py.
filterwarnings =
    ignore::DeprecationWarning
