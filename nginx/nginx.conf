events {
    worker_connections 1024;
}

http {
    # Include default MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not advertise the exact nginx version in responses/error pages
    server_tokens off;

    # Add additional MIME types for modern web apps
    types {
        application/javascript js mjs;
        application/json json;
        application/manifest+json webmanifest;
        text/css css;
        text/html html htm;
        image/svg+xml svg svgz;
        font/woff woff;
        font/woff2 woff2;
    }

    # Request body cap — the API only ever receives small JSON documents
    client_max_body_size 1m;

    # Per-IP request budgets. The auth zone protects credential endpoints from
    # brute force even before the application-level limiter is reached.
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=1r/s;
    limit_req_status 429;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Baseline response hardening (the app adds its own headers too)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Credential endpoints — tightest limit, small burst for retries
        location ~ ^/api/v1/users/(login|register|verify-otp|forgot-password|reset-password)$ {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API requests
        location /api/ {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Interactive API docs and the OpenAPI schema describe the whole attack
        # surface. They are not proxied; enable ENABLE_API_DOCS and reach the
        # backend directly (or behind an authenticated tunnel) when needed.
        location = /docs {
            return 404;
        }

        location = /redoc {
            return 404;
        }

        location = /openapi.json {
            return 404;
        }

        # WebSocket support
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js HMR (development)
        location /_next/webpack-hmr {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
